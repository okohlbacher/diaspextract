[package]
name = "diaspextract-gui"
version = "1.9.1"
description = "DIAspeXtract desktop app"
authors = ["Oliver Kohlbacher and contributors"]
license = "BSD-3-Clause"
edition = "2021"

[lib]
name = "diaspextract_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
