name: full build

# Builds OpenMS from source at the commit pinned in patches/openms.lock, applies the DIAspeXtract
# patches, builds the tool, and runs the end-to-end suite against the binary it just built.
#
# DIAspeXtract cannot be built against a RELEASED OpenMS package, and that is a property of the tool
# rather than of CI: it uses BrukerTimsFile::loadDIAStreaming and PeakPickerIM, which postdate
# OpenMS 3.5.0, the newest tag; and it needs the four patches in patches/, one of which adds
# BrukerTimsFile::lastMzCalibration(). Hence a source build at a pinned commit.
#
# Roughly an hour with a warm ccache, so it runs weekly and on demand rather than per push. It is
# the only job that proves the tool compiles, and it is deliberately NOT continue-on-error: a build
# job allowed to fail quietly reports green while the tool does not build.
on:
  workflow_dispatch:
    inputs:
      openms_ref:
        description: 'OpenMS ref to build against (default: the pin in patches/openms.lock)'
        required: false
        default: ''
  push:
    tags: ['v*']
  schedule:
    - cron: '0 4 * * 1'      # Mondays, 04:00 UTC

jobs:
  linux:
    name: ubuntu-latest, OpenMS from source + patches
    # The weekly build runs only on the public repository (.../diaspextract): this file is exported there
    # unchanged, and the private development repository pays for its Actions minutes. Tag pushes and
    # manual dispatches run everywhere.
    if: github.event_name != 'schedule' || endsWith(github.repository, '/diaspextract')
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v7
        with: { path: diaspextract }

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build ccache ca-certificates lsb-release wget \
            qt6-base-dev libqt6svg6-dev \
            libboost-all-dev libeigen3-dev libxerces-c-dev libbz2-dev zlib1g-dev \
            libglpk-dev libsvm-dev libhdf5-dev libsqlite3-dev libzip-dev liblzma-dev \
            coinor-libcbc-dev coinor-libcgl-dev coinor-libclp-dev \
            coinor-libcoinutils-dev coinor-libosi-dev
          # Arrow/Parquet are not in stock Ubuntu; OpenMS needs them for the mzPeak format.
          wget -q "https://apache.jfrog.io/artifactory/arrow/$(lsb_release --id --short | tr 'A-Z' 'a-z')/apache-arrow-apt-source-latest-$(lsb_release --codename --short).deb"
          sudo apt-get install -y ./apache-arrow-apt-source-latest-*.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libarrow-dev libparquet-dev

      - name: ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          key: openms-${{ runner.os }}
          max-size: 2G

      - name: Check out OpenMS
        # Pinned by default: a moving base makes a patch failure indistinguishable from an upstream
        # change. Pass openms_ref to test against a newer commit deliberately.
        run: |
          REF="${{ github.event.inputs.openms_ref }}"
          [ -n "$REF" ] || REF=$(sed -n 's/^OPENMS_BASE=//p' diaspextract/patches/openms.lock)
          echo "building against OpenMS $REF"
          git clone https://github.com/OpenMS/OpenMS.git
          git -C OpenMS checkout "$REF"

      - name: Apply the DIAspeXtract patches to OpenMS
        run: diaspextract/scripts/apply_openms_patches.sh "$GITHUB_WORKSPACE/OpenMS"

      - name: Build OpenMS
        run: |
          cmake -S OpenMS -B OpenMS/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DWITH_GUI=OFF -DHAS_XSERVER=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build OpenMS/build --target OpenMS

      - name: Build DIAspeXtract
        run: |
          cmake -S diaspextract -B diaspextract/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DOpenMS_DIR="$GITHUB_WORKSPACE/OpenMS/build" \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          cmake --build diaspextract/build

      # The C++ unit tests again, under the tool build's own flags (tests.yml builds them without OpenMS):
      # dnoise_ms1 pins D's FMA-sensitive gate boxes, tdf_load the analysis.tdf metadata loader. Each must
      # actually run -- a regex that matches no registered test passes vacuously.
      - name: C++ unit tests in the tool build (dnoise MS1 port, analysis.tdf loader)
        run: |
          set -o pipefail
          ctest --test-dir diaspextract/build --output-on-failure --no-tests=error -R 'dnoise|tdf_load' | tee "$RUNNER_TEMP/ctest.txt"
          for t in dnoise_ms1 tdf_load; do
            grep -Eq "Test +#[0-9]+: $t" "$RUNNER_TEMP/ctest.txt" \
              || { echo "::error::no $t test ran in the tool build"; exit 1; }
          done

      # OpenMS refuses to start without its share/ directory (unit definitions, CV terms). A source
      # build does not install it, so point at the tree directly. Without this the binary dies on
      # --help with an uncaught exception whose message never reaches the log.
      # These gates run the binary with NOTHING inherited from the runner except the variables
      # the tool documents as required. `env -i` is the load-bearing part: a runner that still has
      # the build tree on PATH, or OPENMS_DATA_PATH exported globally, will happily run a binary
      # that cannot stand on its own -- which is how a broken artefact reaches users past a green
      # pipeline.
      #
      # Streams are MERGED deliberately: TOPPBase writes --help to STDERR, not stdout, so a gate
      # that reads stdout alone sees an empty file and every grep below passes vacuously.
      - name: The binary runs from a clean environment and reports itself
        run: |
          set -o pipefail
          env -i HOME="$HOME" \
                 OPENMS_DATA_PATH="$GITHUB_WORKSPACE/OpenMS/share/OpenMS" \
                 LD_LIBRARY_PATH="$GITHUB_WORKSPACE/OpenMS/build/lib" \
                 diaspextract/build/diaspextract --help > help.txt 2>&1 \
            || { echo "::error::the tool does not run from a clean environment"; cat help.txt; exit 1; }
          head -6 help.txt

          # the space matters: '^DIAspeXtract' alone would also accept the pre-rename 'DIAspeXtractor -- ...' header
          grep -q '^DIAspeXtract ' help.txt \
            || { echo "::error::the tool does not identify itself as DIAspeXtract"; cat help.txt; exit 1; }

          # OUR version, not the OpenMS one TOPPBase prints by default.
          V=$(sed -n 's/^project(DIAspeXtract VERSION \([0-9.]*\).*/\1/p' diaspextract/CMakeLists.txt)
          VE=${V//./\\.}   # 1.3.0 -> 1\.3\.0: the dots are literal in both greps below
          grep -q "^Version: $VE" help.txt \
            || { echo "::error::wrong version (want $V, likely OpenMS's)"; cat help.txt; exit 1; }
          # and the OpenMS build alongside it, because a bug report needs both numbers
          grep -qE "^Version: $VE \\(OpenMS .+\\)" help.txt \
            || { echo "::error::Version line does not carry the OpenMS build"; cat help.txt; exit 1; }

          # OpenMS builds with ENABLE_UPDATE_CHECK=ON by default and TOPPBase then makes a network
          # request on every run; when it fails, Qt prints to stderr and users report it as ours.
          # main() disables it -- assert that it stayed disabled.
          ! grep -qi 'QIODevice\|QNetwork' help.txt \
            || { echo "::error::the OpenMS update check is live -- see main()"; cat help.txt; exit 1; }

      # Same check tests.yml runs from the source, but against the inventory the binary actually
      # registers -- the only authority on what the shipped tool accepts.
      - name: Option tokens in the shipped examples and README are options the binary registers
        run: |
          set -o pipefail
          env -i HOME="$HOME" \
                 OPENMS_DATA_PATH="$GITHUB_WORKSPACE/OpenMS/share/OpenMS" \
                 LD_LIBRARY_PATH="$GITHUB_WORKSPACE/OpenMS/build/lib" \
                 diaspextract/build/diaspextract -write_ini "$RUNNER_TEMP/ini.xml"
          python3 diaspextract/scripts/check_option_tokens.py --ini "$RUNNER_TEMP/ini.xml"

      - name: End-to-end suite against the freshly built binary
        env:
          OPENMS_DATA_PATH: ${{ github.workspace }}/OpenMS/share/OpenMS
        run: python3 diaspextract/test/test_diaspextract.py diaspextract/build/diaspextract

      # A tool that only builds against a PATCHED development OpenMS has one more way to ship
      # broken: the patches silently not applying. apply_openms_patches.sh is what CI runs above,
      # so assert the markers the four patches leave behind are actually in the built tree.
      - name: The OpenMS patches are in the tree the binary was built from
        run: |
          set -o pipefail
          fail=0
          for f in diaspextract/patches/*.patch; do
            base=$(basename "$f")
            # every patch must at least apply cleanly in reverse -- i.e. it IS applied
            if ! git -C OpenMS apply --reverse --check "$GITHUB_WORKSPACE/$f" 2>/dev/null; then
              echo "::error::$base is NOT applied to the OpenMS tree"; fail=1
            else
              echo "  ok: $base"
            fi
          done
          exit $fail
