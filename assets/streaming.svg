<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" font-family="system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/></marker></defs>
  <rect width="1000" height="420" fill="#ffffff"/>
  <text x="500" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1a202c">Streaming: retention-time cells, tiles, and why the fragment working set is one tile's</text>
  <text x="30" y="70" fill="#2d3748" font-weight="600">run</text>
  <line x1="80" y1="80" x2="940" y2="80" stroke="#4a5568" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="940" y="70" text-anchor="end" fill="#718096" font-size="11">retention time</text>
  <g fill="#edf2f7" stroke="#a0aec0">
    <rect x="80" y="90" width="120" height="34"/><rect x="200" y="90" width="120" height="34"/><rect x="320" y="90" width="120" height="34"/><rect x="440" y="90" width="120" height="34"/><rect x="560" y="90" width="120" height="34"/><rect x="680" y="90" width="120" height="34"/><rect x="800" y="90" width="120" height="34"/>
  </g>
  <g fill="#2d3748" text-anchor="middle"><text x="140" y="112">cell 1</text><text x="260" y="112">cell 2</text><text x="380" y="112">cell 3</text><text x="500" y="112">cell 4</text><text x="620" y="112">cell 5</text><text x="740" y="112">cell 6</text><text x="860" y="112">…</text></g>
  <text x="80" y="144" fill="#4a5568" font-size="12">-tile:rt_sec 600: fixed 600-s cells, cut at MS1 frame times; every isolation window is traced cell by cell.</text>
  <text x="30" y="200" fill="#2d3748" font-weight="600">tiles</text>
  <rect x="80" y="185" width="120" height="30" rx="6" fill="#fffaf0" stroke="#ed8936" stroke-width="2"/><text x="140" y="205" text-anchor="middle" fill="#7b341e">tile 1</text>
  <rect x="200" y="185" width="120" height="30" rx="6" fill="#fffaf0" stroke="#ed8936"/><text x="260" y="205" text-anchor="middle" fill="#7b341e">tile 2</text>
  <rect x="320" y="185" width="120" height="30" rx="6" fill="#fffaf0" stroke="#ed8936"/><text x="380" y="205" text-anchor="middle" fill="#7b341e">tile 3</text>
  <text x="450" y="205" fill="#718096">… one cell per tile (-tile:cells_per_tile 1); 0 = the whole run in one tile</text>
  <rect x="80" y="235" width="840" height="120" rx="8" fill="#f7fafc" stroke="#cbd5e0"/>
  <text x="95" y="257" fill="#2d3748" font-weight="600">per tile, in order:</text>
  <g fill="#2d3748">
    <text x="95" y="279">1. read the tile's frames (MS2 raw points per isolation window)</text>
    <text x="95" y="299">2. trace fragments in flight-time bands; score the precursors the tile owns against them</text>
    <text x="95" y="319">3. sort the tile's spectra and write them (parallel mzML encoding)</text>
    <text x="95" y="339">4. free the tile, return free pages to the OS (malloc_trim), carry boundary fragments to the next tile</text>
  </g>
  <text x="30" y="394" fill="#2d3748" font-weight="600">memory</text>
  <rect x="90" y="379" width="830" height="22" fill="#edf2f7" stroke="#a0aec0"/>
  <rect x="90" y="379" width="176" height="22" fill="#fed7aa"/>
  <text x="98" y="395" fill="#7b341e" font-size="12">one tile's windows in flight</text>
  <text x="276" y="395" fill="#4a5568" font-size="12">windows admitted while they fit in 75 % of the machine's free RAM (-perf:mem_fraction)</text>
</svg>
