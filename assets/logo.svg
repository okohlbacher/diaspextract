<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="DIAspeXtract">
  <title>DIAspeXtract</title>
  <!-- What the tool does, in one picture: the wide soft band is the isolation window a diaPASEF
       acquisition actually measures; the sharp irregular lines are the fragment spectrum extracted
       from it; the tall accent line with the marker is the precursor that spectrum belongs to. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#13233A"/>
      <stop offset="1" stop-color="#0A111E"/>
    </linearGradient>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <!-- the isolation window the spectrum is pulled out of -->
  <rect x="96" y="52" width="64" height="152" rx="6" fill="url(#win)"/>
  <line x1="96"  y1="52" x2="96"  y2="204" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2"/>
  <line x1="160" y1="52" x2="160" y2="204" stroke="#22D3EE" stroke-opacity="0.35" stroke-width="2"/>

  <!-- the extracted fragment spectrum: sparse and irregular, as a real one is -->
  <g stroke="#8FA3BC" stroke-width="5" stroke-linecap="round">
    <line x1="42"  y1="204" x2="42"  y2="176"/>
    <line x1="56"  y1="204" x2="56"  y2="120"/>
    <line x1="66"  y1="204" x2="66"  y2="188"/>
    <line x1="80"  y1="204" x2="80"  y2="92"/>
    <line x1="90"  y1="204" x2="90"  y2="166"/>
    <line x1="110" y1="204" x2="110" y2="140"/>
    <line x1="120" y1="204" x2="120" y2="182"/>
    <line x1="140" y1="204" x2="140" y2="106"/>
    <line x1="150" y1="204" x2="150" y2="192"/>
    <line x1="172" y1="204" x2="172" y2="132"/>
    <line x1="182" y1="204" x2="182" y2="196"/>
    <line x1="192" y1="204" x2="192" y2="80"/>
    <line x1="206" y1="204" x2="206" y2="158"/>
    <line x1="216" y1="204" x2="216" y2="186"/>
  </g>

  <!-- the precursor -->
  <line x1="128" y1="204" x2="128" y2="62" stroke="#22D3EE" stroke-width="9" stroke-linecap="round"/>
  <circle cx="128" cy="62" r="10" fill="#22D3EE"/>

  <line x1="34" y1="204" x2="222" y2="204" stroke="#3A4A63" stroke-width="5" stroke-linecap="round"/>
</svg>
